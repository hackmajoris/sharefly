version: 2

release:
  name_template: Version {{ .Version }}

builds:
  - id: sharefly
    main: ./cmd/sharefly
    binary: sharefly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: sharefly
    ids:
      - sharefly
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

homebrew_casks:
  - name: sharefly
    ids:
      - sharefly
    repository:
      owner: hackmajoris
      name: homebrew-apps
    homepage: https://github.com/hackmajoris/sharefly
    description: Share static HTML from your tailnet via a public URL through a Cloudflare Tunnel
    binaries:
      - sharefly
    # the release binaries are unsigned, so macOS quarantines what brew downloads; postflight_steps, not a
    # postflight hook, which Homebrew 7 deprecates (goreleaser has no option for it, so a custom block)
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "sharefly"], chdir: "."
        end
      end
